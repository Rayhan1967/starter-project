<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Tool - Login Issue</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }

        h1 {
            color: #4ec9b0;
        }

        .section {
            background: #252526;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            border-left: 3px solid #007acc;
        }

        .success {
            color: #4ec9b0;
        }

        .error {
            color: #f48771;
        }

        .warning {
            color: #dcdcaa;
        }

        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background: #005a9e;
        }

        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h1>🔍 Diagnostic Tool - Login Issue</h1>

    <div class="section">
        <h2>Quick Actions</h2>
        <button onclick="runFullDiagnostic()">🔍 Run Full Diagnostic</button>
        <button onclick="clearAndReload()">🗑️ Clear Storage & Reload</button>
        <button onclick="testLogin()">🧪 Test Login Function</button>
        <button onclick="testRegister()">🧪 Test Register Function</button>
    </div>

    <div id="results"></div>

    <script>
        function log(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const section = document.createElement('div');
            section.className = 'section';

            const typeClass = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            section.innerHTML = `<div class="${typeClass}">${message}</div>`;
            resultsDiv.appendChild(section);
        }

        function runFullDiagnostic() {
            document.getElementById('results').innerHTML = '';
            log('<h2>🔍 Running Full Diagnostic...</h2>');

            // 1. Check if classes are loaded
            log('<h3>1. Checking if classes are loaded...</h3>');
            const classes = ['User', 'EnhancedTask', 'EnhancedStorageManager', 'UserRepository', 'TaskRepository', 'UserController', 'TaskController', 'TaskView'];
            classes.forEach(className => {
                if (typeof window[className] !== 'undefined') {
                    log(`✅ ${className} is loaded`, 'success');
                } else {
                    log(`❌ ${className} is NOT loaded`, 'error');
                }
            });

            // 2. Check localStorage
            log('<h3>2. Checking localStorage...</h3>');
            const keys = Object.keys(localStorage);
            if (keys.length === 0) {
                log('⚠️ localStorage is empty', 'warning');
            } else {
                log(`Found ${keys.length} items in localStorage:`);
                keys.forEach(key => {
                    const value = localStorage.getItem(key);
                    log(`<pre>${key}: ${value.substring(0, 100)}${value.length > 100 ? '...' : ''}</pre>`);
                });
            }

            // 3. Check if app object exists
            log('<h3>3. Checking app object...</h3>');
            if (typeof window.app !== 'undefined') {
                log('✅ app object exists', 'success');
                log(`<pre>${JSON.stringify({
                    storage: typeof app.storage,
                    userRepository: typeof app.userRepository,
                    taskRepository: typeof app.taskRepository,
                    userController: typeof app.userController,
                    taskController: typeof app.taskController,
                    taskView: typeof app.taskView,
                    currentUser: app.currentUser
                }, null, 2)}</pre>`);
            } else {
                log('❌ app object does NOT exist', 'error');
            }

            // 4. Check DOM elements
            log('<h3>4. Checking DOM elements...</h3>');
            const elements = ['loginBtn', 'registerBtn', 'usernameInput', 'registerForm'];
            elements.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    log(`✅ Element #${id} exists`, 'success');
                } else {
                    log(`❌ Element #${id} NOT found`, 'error');
                }
            });

            // 5. Try to get users from repository
            log('<h3>5. Checking users in repository...</h3>');
            if (typeof app !== 'undefined' && app.userRepository) {
                const users = app.userRepository.findAll();
                log(`Found ${users.length} users in repository:`);
                users.forEach(user => {
                    log(`<pre>- ${user.username} (${user.email}) - Active: ${user.isActive}</pre>`);
                });
            } else {
                log('❌ Cannot access userRepository', 'error');
            }

            log('<h2>✅ Diagnostic Complete!</h2>', 'success');
        }

        function clearAndReload() {
            localStorage.clear();
            sessionStorage.clear();
            log('✅ Storage cleared! Reloading in 2 seconds...', 'success');
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        }

        function testLogin() {
            document.getElementById('results').innerHTML = '';
            log('<h2>🧪 Testing Login Function...</h2>');

            if (typeof app === 'undefined' || !app.userController) {
                log('❌ app.userController not available', 'error');
                return;
            }

            // Try to login with demo user
            log('Attempting to login with username: "demo"');
            const response = app.userController.login('demo');

            if (response.success) {
                log(`✅ Login successful!`, 'success');
                log(`<pre>${JSON.stringify(response, null, 2)}</pre>`);
            } else {
                log(`❌ Login failed: ${response.error}`, 'error');
                log(`<pre>${JSON.stringify(response, null, 2)}</pre>`);
            }
        }

        function testRegister() {
            document.getElementById('results').innerHTML = '';
            log('<h2>🧪 Testing Register Function...</h2>');

            if (typeof app === 'undefined' || !app.userController) {
                log('❌ app.userController not available', 'error');
                return;
            }

            // Try to register a test user
            const testUser = {
                username: 'testuser_' + Date.now(),
                email: 'test@example.com',
                fullName: 'Test User'
            };

            log(`Attempting to register user: ${testUser.username}`);
            const response = app.userController.register(testUser);

            if (response.success) {
                log(`✅ Registration successful!`, 'success');
                log(`<pre>${JSON.stringify(response, null, 2)}</pre>`);
            } else {
                log(`❌ Registration failed: ${response.error}`, 'error');
                log(`<pre>${JSON.stringify(response, null, 2)}</pre>`);
            }
        }

        // Auto-run diagnostic on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(runFullDiagnostic, 500);
        });
    </script>
</body>

</html>
